name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile check
        run: python -m py_compile $(find backend -name "*.py")

      - name: Run unit tests (no external services required)
        run: |
          pytest tests/test_auth_security.py tests/test_rag_chunker.py \
                 tests/test_tool_manager.py tests/test_agent_manager.py \
                 tests/test_scheduler.py -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck + build
        run: npm run build
